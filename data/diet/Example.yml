ricetta_pancakes:
  ingredienti:
    - "1 uovo"
    - "80 g di albume d'uovo"
    - "40 g di farina d'avena"
    - "50 g di yogurt greco"
    - "1/2 banana schiacciata"
    - "1 punta di cucchiaino di lievito per dolci"
    - "cannella a piacere"
  preparazione: "Mescolare l'uovo con l'albume, aggiungere la banana schiacciata, lo yogurt, la farina d'avena, il lievito e la cannella. Cuocere piccoli pancakes in una padella antiaderente leggermente unta."

indicazioni_generali:
  - "Utilizzare erbe aromatiche, spezie, limone e aceto a piacere, limitando il sale"
  - "Bere circa 2 litri di acqua durante la giornata"
  - "Durante l'attività fisica aumentare gradualmente l'assunzione di liquidi"
  - "È possibile scambiare il pranzo con la cena mantenendo le rispettive quantità"
  - "Le grammature indicate si riferiscono agli alimenti al netto degli scarti"
  - "Le verdure possono essere variate liberamente rispettando la stagionalità"

